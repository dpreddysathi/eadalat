server:
  port: 8080

spring:
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**
        - id: case-service
          uri: ${CASE_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/cases/**
        - id: scheduling-service
          uri: ${SCHEDULING_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/hearings/**
        - id: document-service
          uri: ${DOCUMENT_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/documents/**
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/notifications/**
        - id: hearing-service
          uri: ${HEARING_SERVICE_URL:http://localhost:8086}
          # Single Path predicate with comma-separated patterns = OR match.
          # (Two separate Path entries would be ANDed and could never match.)
          predicates:
            - Path=/api/rooms/**, /ws-hearing/**

jwt:
  secret: ${JWT_SECRET:eadalat-dev-secret-change-in-prod-min-32-chars!!}
