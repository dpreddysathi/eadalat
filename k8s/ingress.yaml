apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eadalat
  namespace: eadalat
spec:
  ingressClassName: nginx
  rules:
    - host: eadalat.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
