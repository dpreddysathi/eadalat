# NOTE: the web UI is served separately (web-client is a static site, e.g. via the
# docker-compose `web` service). This is an acceptable placeholder: an nginx
# Deployment + Service you can point at your built web-client image.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: eadalat
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: eadalat
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
